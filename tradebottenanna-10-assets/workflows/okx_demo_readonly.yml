name: ApexFlash OKX EU Demo Read-only Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  demo-readonly-test:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    env:
      OKX_API_KEY: ${{ secrets.OKX_API_KEY }}
      OKX_API_SECRET: ${{ secrets.OKX_API_SECRET }}
      OKX_API_PASSPHRASE: ${{ secrets.OKX_API_PASSPHRASE }}
    steps:
      - name: Test authenticated OKX EU demo access (READ ONLY)
        shell: bash
        run: |
          python - <<'PY'
          import base64
          import hashlib
          import hmac
          import json
          import os
          import sys
          import urllib.error
          import urllib.request
          from datetime import datetime, timezone

          BASE = "https://eea.okx.com"
          KEY = os.environ.get("OKX_API_KEY", "")
          SECRET = os.environ.get("OKX_API_SECRET", "")
          PASSPHRASE = os.environ.get("OKX_API_PASSPHRASE", "")

          missing = [
              name for name, value in (
                  ("OKX_API_KEY", KEY),
                  ("OKX_API_SECRET", SECRET),
                  ("OKX_API_PASSPHRASE", PASSPHRASE),
              ) if not value
          ]
          if missing:
              print("FAIL: Missing GitHub Actions secret(s): " + ", ".join(missing))
              sys.exit(1)

          def okx_get(path):
              timestamp = datetime.now(timezone.utc).isoformat(timespec="milliseconds").replace("+00:00", "Z")
              method = "GET"
              body = ""
              prehash = timestamp + method + path + body
              signature = base64.b64encode(
                  hmac.new(SECRET.encode(), prehash.encode(), hashlib.sha256).digest()
              ).decode()
              headers = {
                  "OK-ACCESS-KEY": KEY,
                  "OK-ACCESS-SIGN": signature,
                  "OK-ACCESS-TIMESTAMP": timestamp,
                  "OK-ACCESS-PASSPHRASE": PASSPHRASE,
                  "x-simulated-trading": "1",
                  "Content-Type": "application/json",
                  "User-Agent": "ApexFlash-OKX-EU-Demo-ReadOnly-Test",
              }
              request = urllib.request.Request(BASE + path, headers=headers, method=method)
              try:
                  with urllib.request.urlopen(request, timeout=20) as response:
                      payload = json.loads(response.read().decode("utf-8"))
              except urllib.error.HTTPError as exc:
                  # Never print request headers, signatures, or secrets.
                  body_text = exc.read().decode("utf-8", errors="replace")
                  print(f"HTTP ERROR {exc.code}: {body_text[:1000]}")
                  sys.exit(1)
              except Exception as exc:
                  print(f"REQUEST ERROR: {type(exc).__name__}: {exc}")
                  sys.exit(1)

              if payload.get("code") != "0":
                  print("OKX API ERROR:", payload.get("code"), payload.get("msg", ""))
                  sys.exit(1)
              return payload.get("data", [])

          print("Testing OKX EEA demo API authentication...")
          print("Endpoint: https://eea.okx.com")
          print("Demo header: x-simulated-trading: 1")
          print("Order methods: NOT USED")

          balance = okx_get("/api/v5/account/balance")
          print("PASS: authenticated account balance request succeeded.")
          if balance:
              details = balance[0]
              print("Account details returned:", "yes")
              print("Account currency rows:", len(details.get("details", [])))
              total_eq = details.get("totalEq")
              if total_eq is not None:
                  print("Total equity (account-reported):", total_eq)
          else:
              print("Account response contained no balance records.")

          positions = okx_get("/api/v5/account/positions")
          print("PASS: authenticated positions request succeeded.")
          print("Open position rows returned:", len(positions))
          print("PASS: read-only demo connection verified; no orders were submitted.")
          PY
