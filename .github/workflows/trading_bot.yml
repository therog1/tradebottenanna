name: ApexFlash OKX EU - SAFE DRY RUN

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: apexflash-okx-safe
  cancel-in-progress: false

jobs:
  run-trading-bot:
    name: ApexFlash OKX public-data dry run
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ApexFlash (forced safe mode)
        env:
          EXCHANGE_ID: 'okx'
          # This patch is intentionally dry-run only. No trading API secrets needed.
          USE_TESTNET: 'false'
          DRY_RUN: 'true'
          LIVE_TRADING_ENABLED: 'false'
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          RISK_PER_TRADE_PCT: '0.8'
          MIN_CONFIDENCE: '0.72'
          MAX_LEVERAGE: '10'
          MIN_LEVERAGE: '3'
          TIMEFRAME: '15m'
        run: python main.py
