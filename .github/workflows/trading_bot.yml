name: ApexFlash Crypto Futures Bot

on:
  schedule:
    # Keep scheduled runs in dry-run mode until the system has been fully verified.
    - cron: '*/15 * * * *'

  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Simulerad körning (rekommenderas)'
        required: true
        type: boolean
        default: true
      allow_live_trading:
        description: 'Tillåt livehandel (kräver separat granskning)'
        required: true
        type: boolean
        default: false
      risk_percent:
        description: 'Risk per trade (% av saldo)'
        required: false
        type: string
        default: '0.8'

concurrency:
  group: apexflash-bot
  cancel-in-progress: false

jobs:
  run-trading-bot:
    name: Execute ApexFlash
    runs-on: ubuntu-latest
    timeout-minutes: 8

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Configure Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run ApexFlash (safe by default)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          EXCHANGE_ID: 'bybit'
          USE_TESTNET: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_live_trading && !inputs.dry_run && 'false' || 'true' }}
          # Scheduled runs are always dry-run. Manual runs are dry-run unless explicitly disabled.
          DRY_RUN: ${{ github.event_name == 'schedule' && 'true' || (inputs.dry_run && 'true' || 'false') }}
          LIVE_TRADING_ENABLED: ${{ github.event_name == 'workflow_dispatch' && inputs.allow_live_trading && !inputs.dry_run && 'true' || 'false' }}
          RISK_PER_TRADE_PCT: ${{ inputs.risk_percent || '0.8' }}
          MIN_CONFIDENCE: '0.72'
          MAX_LEVERAGE: '10'
          MIN_LEVERAGE: '3'
          TIMEFRAME: '15m'
        run: python main.py
