name: OKX EU Market Test

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  market-test:
    runs-on: ubuntu-latest
    steps:
      - name: Check OKX EU public markets
        run: |
          python - <<'PY'
          import json
          import urllib.request
          import urllib.parse

          BASE = "https://eea.okx.com"
          ASSETS = ("BTC", "ETH", "SOL", "AVAX", "SUI")

          for inst_type in ("FUTURES", "SWAP"):
              params = urllib.parse.urlencode({"instType": inst_type})
              url = f"{BASE}/api/v5/public/instruments?{params}"
              print(f"\n=== {inst_type} ===")
              print(f"URL: {url}")

              req = urllib.request.Request(
                  url, headers={"User-Agent": "ApexFlash-market-test"}
              )
              with urllib.request.urlopen(req, timeout=20) as response:
                  result = json.loads(response.read().decode("utf-8"))

              if result.get("code") != "0":
                  print("API ERROR:", result.get("code"), result.get("msg"))
                  continue

              instruments = result.get("data", [])
              matches = [
                  item for item in instruments
                  if any(item.get("instId", "").startswith(f"{asset}-USDT")
                         for asset in ASSETS)
              ]

              print("Total instruments:", len(instruments))
              print("Matching instruments:", len(matches))
              for item in matches:
                  print(
                      item.get("instId"),
                      "| state:", item.get("state"),
                      "| expiry:", item.get("expTime"),
                      "| alias:", item.get("alias")
                  )
              if not matches:
                  print("No matching USDT instruments found.")

          print("\nPublic market test finished.")
          PY
