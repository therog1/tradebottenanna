name: TradebottenAnna Execution Cycle

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only"
        required: false
        type: boolean
        default: true
  # No schedule: the engine must not run automatically until Roger approves.
  # (The workflow is also disabled in GitHub Actions.)

jobs:
  run-demo-cycle:
    name: Run Controlled Execution Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Controlled Cycle
        env:
          OKX_API_KEY: ${{ secrets.OKX_API_KEY || secrets.OKX_DEMO_API_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY || secrets.OKX_DEMO_SECRET_KEY }}
          OKX_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE || secrets.OKX_DEMO_PASSPHRASE }}
          OKX_DEMO_API_KEY: ${{ secrets.OKX_API_KEY || secrets.OKX_DEMO_API_KEY }}
          OKX_DEMO_SECRET_KEY: ${{ secrets.OKX_SECRET_KEY || secrets.OKX_DEMO_SECRET_KEY }}
          OKX_DEMO_PASSPHRASE: ${{ secrets.OKX_PASSPHRASE || secrets.OKX_DEMO_PASSPHRASE }}
          DRY_RUN: ${{ inputs.dry_run == false && 'false' || 'true' }}
        run: |
          echo "Starting TradebottenAnna execution cycle (DRY_RUN=$DRY_RUN)..."
          python main.py
