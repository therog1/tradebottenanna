name: TradebottenAnna Execution Cycle

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Dry run only"
        required: false
        type: boolean
        default: true
  # Hourly LIVE run, approved by Roger 2026-10-14 (risk caps 1%/trade, 3% total hardcoded).
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  actions: write

jobs:
  run-demo-cycle:
    name: Run Controlled Execution Cycle
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"
          cache: "pip"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Controlled Cycle
        env:
          # Anna = only OKX_ANNA_* (no fallback), chosen by Roger 2026-10-14
          OKX_API_KEY: ${{ secrets.OKX_ANNA_KEY }}
          OKX_SECRET_KEY: ${{ secrets.OKX_ANNA_SECRET }}
          OKX_PASSPHRASE: ${{ secrets.OKX_ANNA_PASS }}
          # schedule -> live; manual dispatch -> dry run unless dry_run=false is chosen
          DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || (inputs.dry_run == false && 'false' || 'true') }}
        run: |
          echo "Starting TradebottenAnna execution cycle (DRY_RUN=$DRY_RUN)..."
          python main.py

      - name: Refresh dashboard status feed (read-only)
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh workflow run status-feed.yml -R "$GITHUB_REPOSITORY" --ref main || echo "status-feed dispatch failed (non-fatal)"
