name: ApexFlash OKX EU - Gemini Diagnostic

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Show safe configuration
        env:
          EXCHANGE_ID: okx
          DRY_RUN: 'true'
          LIVE_TRADING_ENABLED: 'false'
        run: |
          python - <<'PY'
          import os
          print("EXCHANGE_ID =", os.getenv("EXCHANGE_ID"))
          print("DRY_RUN =", os.getenv("DRY_RUN"))
          print("LIVE_TRADING_ENABLED =", os.getenv("LIVE_TRADING_ENABLED"))
          print("This diagnostic does not execute main.py or place orders.")
          PY
