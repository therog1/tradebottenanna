name: Bot scheduler (keepalive)

# GitHub:s cron körs ofta timmar sent. Det här jobbet startar demo_trading.yml var 60:e minut
# i en loop (~5,5 h), och startar sedan om sig självt. Cron nedan är reserv om kedjan bryts.
on:
  workflow_dispatch:
  schedule:
    - cron: '7 */3 * * *'

permissions:
  actions: write

concurrency:
  group: bot-scheduler
  cancel-in-progress: false

jobs:
  loop:
    runs-on: ubuntu-latest
    timeout-minutes: 350
    steps:
      - env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Var 15:e min: uppdatera status-feeden (behövs för exponeringstaket). Varje timme: kör Anna.
          end=$(( $(date +%s) + 330*60 )); i=0
          while [ $(date +%s) -lt $end ]; do
            gh workflow run status-feed.yml -R "$GITHUB_REPOSITORY" --ref main || echo "feed-dispatch misslyckades"
            if [ $(( i % 4 )) -eq 0 ]; then
              sleep 120  # låt feeden hinna bli färsk före Annas körning
              gh workflow run demo_trading.yml -R "$GITHUB_REPOSITORY" --ref main -f dry_run=false || echo "anna-dispatch misslyckades"
              sleep 780
            else
              sleep 900
            fi
            i=$((i+1))
          done
          gh workflow run bot-scheduler.yml -R "$GITHUB_REPOSITORY" --ref main
