name: Tradebot Scheduled Execution Engine

on:
  schedule:
    # Körs var 15:e minut för Lena OBI-scalper och Anna swing-kontroll
    - cron: '*/15 * * * *'
  workflow_dispatch:
    inputs:
      bot:
        description: 'Välj bot att köra'
        required: true
        default: 'lena'
        type: choice
        options:
          - lena
          - anna
          - both
      dry_run:
        description: 'Dry run / paper mode (inga skarpa ordrar placeras)'
        required: false
        default: false
        type: boolean

permissions:
  contents: write

jobs:
  run-trading-cycle:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci || npm install

      - name: Execute Quantitative Trading Cycle
        env:
          # Inga nycklar finns i webbläsaren! Allt hämtas från säkra GitHub Repository Secrets:
          OKX_AGGR_KEY: ${{ secrets.OKX_AGGR_KEY }}
          OKX_AGGR_SECRET: ${{ secrets.OKX_AGGR_SECRET }}
          OKX_AGGR_PASS: ${{ secrets.OKX_AGGR_PASS }}
          OKX_ANNA_KEY: ${{ secrets.OKX_ANNA_KEY }}
          OKX_ANNA_SECRET: ${{ secrets.OKX_ANNA_SECRET }}
          OKX_ANNA_PASS: ${{ secrets.OKX_ANNA_PASS }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          DRY_RUN: ${{ github.event.inputs.dry_run || 'false' }}
          TARGET_BOT: ${{ github.event.inputs.bot || 'both' }}
        run: |
          npx tsx scripts/run_trading_cycle.ts

      - name: Commit Updated Status (Read-Only Telemetry)
        run: |
          git config --global user.name "Tradebot Quantitative Engine"
          git config --global user.email "bot@tradebottenanna.local"
          git add public/data/status.json
          git diff --staged --quiet || (git commit -m "chore(telemetry): update live OKX status & positions [skip ci]" && git push)
